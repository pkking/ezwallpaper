name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Keep only the newest revision's evidence for a PR; older runs are invalidated
# by later commits and must not consume runners while the current head waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan-integrity:
    name: Agent plan integrity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Issue and execution plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/validate_agent_plan.py

  contract-tests:
    name: Agent contract self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline validator positive and negative cases
        run: python3 -m unittest discover -s tests -p 'test_agent_plan.py' -v

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (keep original strict checks)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -W clippy::unwrap_used

  rust-tests:
    name: Rust tests and CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust tests
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          cargo test --workspace --all-targets --verbose 2>&1 | tee artifacts/ci/cargo-test.log
      - name: Verify headless core independently
        run: cargo check -p ezwallpaper-core
      - name: Offline CLI acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          cargo build --bin ezwallpaper
          # End-to-end Core manifest -> CLI apply -> isolated fake desktop commands.
          # Stub-only PATH guarantees this test cannot invoke host GUI setters.
          python3 -m unittest discover -s tests -p 'test_desktop_adapter_contract.py' -v 2>&1 | tee artifacts/ci/desktop-adapter-contract.log
          # State-machine safety tests only; no real desktop commands or effects.
          python3 -m unittest discover -s tests -p 'test_gnome_live_verification.py' -v 2>&1 | tee artifacts/ci/gnome-live-safety.log
          # Dual-output niri/Noctalia mock-only checks: no real compositor or desktop changes.
          python3 -m unittest discover -s tests -p 'test_noctalia_live_verification.py' -v 2>&1 | tee artifacts/ci/noctalia-live-safety.log
          target/debug/ezwallpaper --help > artifacts/ci/help.txt
          target/debug/ezwallpaper --version > artifacts/ci/version.txt
          grep -q -- '--backend' artifacts/ci/help.txt
          grep -q -- '--download-only' artifacts/ci/help.txt
          target/debug/ezwallpaper list --help > artifacts/ci/list-help.txt
          target/debug/ezwallpaper fetch --help > artifacts/ci/fetch-help.txt
          catalog_dir="$(mktemp -d)"
          trap 'rm -rf "$catalog_dir"' EXIT
          printf 'fixture' > "$catalog_dir/wallpaper.JPG"
          printf 'irrelevant' > "$catalog_dir/notes.txt"
          target/debug/ezwallpaper -d "$catalog_dir" list --json > artifacts/ci/catalog.json
          grep -q '"schema_version": 1' artifacts/ci/catalog.json
          grep -q '"source": "local"' artifacts/ci/catalog.json
          grep -q 'wallpaper.JPG' artifacts/ci/catalog.json
          ! grep -q 'notes.txt' artifacts/ci/catalog.json
          # Fingerprinting is an offline, side-effect-free Core/CLI contract.
          printf 'abc' > "$catalog_dir/hash-fixture.png"
          target/debug/ezwallpaper hash "$catalog_dir/hash-fixture.png" > artifacts/ci/hash.txt
          grep -Fxq 'sha256:ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad' artifacts/ci/hash.txt
          # Explicit isolated store smoke: no network, GUI, or implicit --dir changes.
          store_root="$catalog_dir/owned-store"
          target/debug/ezwallpaper store --root "$store_root" init > artifacts/ci/store-init.txt
          target/debug/ezwallpaper store --root "$store_root" list > artifacts/ci/store-empty-list.txt
          test ! -s artifacts/ci/store-empty-list.txt
          target/debug/ezwallpaper store --root "$store_root" list --json > artifacts/ci/store-empty-list.json
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1])) == {"schema_version":1,"entries":[]}' artifacts/ci/store-empty-list.json
          target/debug/ezwallpaper store --root "$store_root" import "$catalog_dir/hash-fixture.png" > artifacts/ci/store-import.txt
          grep -Fxq 'sha256:ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad' artifacts/ci/store-import.txt
          content_id="$(cat artifacts/ci/store-import.txt)"
          # Identical bytes must deduplicate, and inventory must survive reopening.
          target/debug/ezwallpaper store --root "$store_root" import "$catalog_dir/hash-fixture.png" > artifacts/ci/store-reimport.txt
          grep -Fxq "$content_id" artifacts/ci/store-reimport.txt
          target/debug/ezwallpaper store --root "$store_root" list > artifacts/ci/store-list.txt
          printf '%s\t3 bytes\n' "$content_id" > artifacts/ci/store-list.expected
          cmp artifacts/ci/store-list.expected artifacts/ci/store-list.txt
          target/debug/ezwallpaper store --root "$store_root" list --json > artifacts/ci/store-list.json
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1])) == {"schema_version":1,"entries":[{"content_id":sys.argv[2],"size_bytes":3}]}' artifacts/ci/store-list.json "$content_id"
          target/debug/ezwallpaper store --root "$store_root" inspect "$content_id" > artifacts/ci/store-inspect.txt
          grep -Fq "$content_id" artifacts/ci/store-inspect.txt
          target/debug/ezwallpaper store --root "$store_root" export "$content_id" "$catalog_dir/exported.jpg" > artifacts/ci/store-export.txt
          cmp "$catalog_dir/hash-fixture.png" "$catalog_dir/exported.jpg"
          ! target/debug/ezwallpaper store --root "$store_root" export "$content_id" "$catalog_dir/exported.jpg"
          # Corrupt a disposable cache index; no partial result may be printed.
          index_bucket="$(find "$store_root/cache/index-v5" -type f | head -n 1)"
          test -n "$index_bucket"
          printf '\nbroken\t{}' > "$index_bucket"
          set +e
          target/debug/ezwallpaper store --root "$store_root" list > artifacts/ci/store-broken.stdout 2> artifacts/ci/store-broken.stderr
          list_status=$?
          set -e
          test "$list_status" -ne 0
          test ! -s artifacts/ci/store-broken.stdout
          test -s artifacts/ci/store-broken.stderr
          set +e
          target/debug/ezwallpaper store --root "$store_root" list --json > artifacts/ci/store-broken-json.stdout 2> artifacts/ci/store-broken-json.stderr
          json_status=$?
          set -e
          test "$json_status" -ne 0
          test ! -s artifacts/ci/store-broken-json.stdout
          test -s artifacts/ci/store-broken-json.stderr
          target/debug/ezwallpaper doctor > artifacts/ci/doctor.txt
          grep -q -- 'adapter:' artifacts/ci/doctor.txt
          set +e
          target/debug/ezwallpaper apply /nonexistent-ezwallpaper-ci-wallpaper.png > artifacts/ci/apply.stdout 2> artifacts/ci/apply.stderr
          apply_status=$?
          set -e
          test "$apply_status" -ne 0
          grep -q -- 'wallpaper file is not accessible' artifacts/ci/apply.stderr
          set +e
          target/debug/ezwallpaper --backend not-a-provider --download-only > artifacts/ci/invalid.stdout 2> artifacts/ci/invalid.stderr
          status=$?
          set -e
          test "$status" -ne 0
          grep -q -- 'unsupported backend' artifacts/ci/invalid.stderr
      - name: Preserve offline test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-cli-offline-evidence
          path: artifacts/ci/
          if-no-files-found: warn

  sway-visual-e2e:
    name: Sway headless visual E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install real headless compositor and capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sway swaybg grim
          sway --version
          grim -h || true
      - name: Check pure Python PNG/PPM assertion helpers
        run: python3 -m unittest discover -s tests -p 'test_sway_e2e_helpers.py' -v
      - name: Verify offline dual-output topology and pixel helpers
        run: python3 -m unittest discover -s tests -p 'test_sway_dual_helpers.py' -v
      - name: Build actual ezwallpaper CLI
        run: cargo build --bin ezwallpaper
      - name: Observe actual composited Sway wallpaper
        run: |
          set -euo pipefail
          mkdir -p artifacts/sway-e2e
          python3 tests/e2e/sway/run.py --binary target/debug/ezwallpaper --artifact-dir artifacts/sway-e2e 2>&1 | tee artifacts/sway-e2e/test.log
      - name: Observe isolated two-output Sway framebuffer separation
        run: |
          set -euo pipefail
          mkdir -p artifacts/sway-dual-e2e
          python3 tests/e2e/sway/dual.py --artifact-dir artifacts/sway-dual-e2e 2>&1 | tee artifacts/sway-dual-e2e/test.log
      - name: Always preserve real desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sway-headless-visual-e2e
          path: |
            artifacts/sway-e2e/
            artifacts/sway-dual-e2e/
          if-no-files-found: warn

  noctalia-sway-visual-e2e:
    name: Noctalia v5.2.1 + Sway dual-render E2E
    runs-on: ubuntu-24.04
    # Trixie provides WirePlumber 0.5 / C++23 and Noctalia's pinned v5.2.1
    # build dependencies; this image is CI-only, not a production dependency.
    container: debian:trixie
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install native Noctalia build requirements and headless Sway tools
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates git curl python3 pkg-config build-essential meson ninja-build passwd libssl-dev \
            dbus dbus-user-session sway grim \
            libwayland-dev wayland-protocols libegl-dev libgles-dev \
            libfreetype-dev libfontconfig-dev libcairo2-dev libpango1.0-dev \
            libharfbuzz-dev libxkbcommon-dev libglib2.0-dev \
            libsecret-1-dev libsodium-dev libsdbus-c++-dev \
            libpipewire-0.3-dev libwireplumber-0.5-dev \
            libpam0g-dev libpolkit-agent-1-dev libpolkit-gobject-1-dev \
            libcurl4-gnutls-dev libwebp-dev libjxl-dev libsndfile1-dev \
            librsvg2-dev libqalculate-dev libxml2-dev libmd4c-dev \
            libtomlplusplus-dev libical-dev nlohmann-json3-dev libstb-dev \
            libgl1-mesa-dri libgbm1 libegl1 libgles2 \
            fonts-dejavu-core
      - name: Install pinned upstream Wayland protocols 1.47 for Noctalia v5
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.47 https://github.com/wayland-mirror/wayland-protocols.git /tmp/wayland-protocols-1.47
          git -C /tmp/wayland-protocols-1.47 describe --tags --exact-match | grep -Fx 1.47
          # Full 1.47 staging protocols include ext-background-effect-v1.
          # Trixie's apt package omits that XML. Never patch Noctalia upstream.
          test -f /tmp/wayland-protocols-1.47/staging/ext-background-effect/ext-background-effect-v1.xml
          meson setup /tmp/wayland-protocols-1.47/build \
            /tmp/wayland-protocols-1.47 -Dtests=false --prefix=/usr/local
          meson install -C /tmp/wayland-protocols-1.47/build
          PKG_CONFIG_PATH=/usr/local/share/pkgconfig pkg-config --modversion wayland-protocols | grep -Fx 1.47
      - name: Verify offline Noctalia/Sway fixture rejection
        run: python3 -m unittest discover -s tests -p 'test_noctalia_sway_helpers.py' -v
      - name: Build actual CLI
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - name: Compile real ezwallpaper CLI
        run: cargo build --bin ezwallpaper
      - name: Build pinned upstream native Noctalia v5.2.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/noctalia-sway-e2e
          git clone --depth 1 --branch v5.2.1 https://github.com/noctalia-dev/noctalia.git /tmp/noctalia-v5.2.1
          git -C /tmp/noctalia-v5.2.1 describe --tags --exact-match | grep -Fx v5.2.1
          git -C /tmp/noctalia-v5.2.1 rev-parse HEAD | tee artifacts/noctalia-sway-e2e/upstream-commit.txt
          grep -Fx '6ef43e2bf2f3d5b4205ec72a72e34a2ab76ce3b4' artifacts/noctalia-sway-e2e/upstream-commit.txt
          (cd /tmp/noctalia-v5.2.1 && \
            PKG_CONFIG_PATH=/usr/local/share/pkgconfig meson setup build-ci --buildtype=release -Dtests=disabled -Djemalloc=disabled -Dnative_optimizations=false && \
            meson compile -C build-ci -j 2 noctalia) \
            2>&1 | tee artifacts/noctalia-sway-e2e/upstream-build.log
          /tmp/noctalia-v5.2.1/build-ci/noctalia --version | tee artifacts/noctalia-sway-e2e/upstream-version.txt
          grep -Fx 'noctalia v5.2.1 (v5.2.1)' artifacts/noctalia-sway-e2e/upstream-version.txt
      - name: Test actual native IPC and dual output rendered pixels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/noctalia-sway-e2e
          export PATH="/tmp/noctalia-v5.2.1/build-ci:$PATH"
          export NOCTALIA_SOURCE_SHA="$(cat artifacts/noctalia-sway-e2e/upstream-commit.txt)"
          # The wrapper owns its private session bus; harness owns compositor,
          # shell processes, HOME, XDG runtime/state and every fixture.
          # Docker job steps run as root: run the compositor as an unprivileged
          # user (Sway refuses root) without modifying an interactive session.
          useradd --create-home --shell /bin/bash ezw-e2e
          chown -R ezw-e2e:ezw-e2e artifacts/noctalia-sway-e2e
          runuser -u ezw-e2e -- env \
            PATH="$PATH" NOCTALIA_SOURCE_SHA="$NOCTALIA_SOURCE_SHA" \
            EZW_OWNED_DBUS_SESSION=1 \
            dbus-run-session -- python3 tests/e2e/sway/noctalia_v5.py \
              --binary target/debug/ezwallpaper \
              --artifact-dir artifacts/noctalia-sway-e2e \
            2>&1 | tee artifacts/noctalia-sway-e2e/test.log
      - name: Validate experimental niri/Noctalia pure helpers
        run: python3 -m unittest discover -s tests -p 'test_niri_noctalia_helpers.py' -v
      - name: Build exact unmerged niri virtual-output PR #3800 (CI-only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/niri-noctalia-e2e
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            clang libclang-dev libudev-dev libgbm-dev libinput-dev \
            libdbus-1-dev libsystemd-dev libseat-dev libdisplay-info-dev
          git clone --depth 1 --branch wip/virtual-outputs \
            https://github.com/willybarret/niri.git /tmp/niri-virtual-3800
          git -C /tmp/niri-virtual-3800 rev-parse HEAD | tee artifacts/niri-noctalia-e2e/upstream-commit.txt
          grep -Fx '7fd585dd44ed67644977dd9561bb6e8b3837f8f7' \
            artifacts/niri-noctalia-e2e/upstream-commit.txt
          (cd /tmp/niri-virtual-3800 && \
            NIRI_BUILD_COMMIT=7fd585dd44ed67644977dd9561bb6e8b3837f8f7 \
              cargo build --locked --release --no-default-features --features dbus) \
            2>&1 | tee artifacts/niri-noctalia-e2e/upstream-build.log
          /tmp/niri-virtual-3800/target/release/niri --version \
            | tee artifacts/niri-noctalia-e2e/upstream-version.txt
      - name: Verify real niri + Noctalia dual-output framebuffer
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/niri-virtual-3800/target/release:/tmp/noctalia-v5.2.1/build-ci:$PATH"
          export NIRI_SOURCE_SHA="$(cat artifacts/niri-noctalia-e2e/upstream-commit.txt)"
          export NOCTALIA_SOURCE_SHA="$(cat artifacts/noctalia-sway-e2e/upstream-commit.txt)"
          chown -R ezw-e2e:ezw-e2e artifacts/niri-noctalia-e2e
          runuser -u ezw-e2e -- env \
            PATH="$PATH" NIRI_SOURCE_SHA="$NIRI_SOURCE_SHA" \
            NOCTALIA_SOURCE_SHA="$NOCTALIA_SOURCE_SHA" EZW_OWNED_DBUS_SESSION=1 \
            dbus-run-session -- python3 tests/e2e/sway/niri_noctalia.py \
              --binary target/debug/ezwallpaper \
              --artifact-dir artifacts/niri-noctalia-e2e \
            2>&1 | tee artifacts/niri-noctalia-e2e/test.log
      - name: Always preserve niri source, topology, screenshot and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-niri-pr3800-native-noctalia-dual-evidence
          path: artifacts/niri-noctalia-e2e/
          if-no-files-found: warn

      - name: Preserve raw actual framebuffer evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-noctalia-5.2.1-sway-dual-evidence
          path: artifacts/noctalia-sway-e2e/
          if-no-files-found: warn

  platform-tests:
    name: Platform tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - name: Headless portable workspace tests
        run: cargo test --workspace --all-targets
      - name: Offline CLI diagnosis (never applies a wallpaper)
        run: cargo run --quiet -- doctor
