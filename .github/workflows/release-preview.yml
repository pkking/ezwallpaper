name: M1 preview package and publish

# PR is read-only validation. Only a successful, protected master CI push
# specifically containing the v0.3.0-alpha.1 release merge can publish.
on:
  pull_request:
    branches: [master]
    paths:
      - Cargo.toml
      - crates/ezwallpaper-core/Cargo.toml
      - CHANGELOG.md
      - docs/releases/**
      - .github/workflows/release-preview.yml
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: m1-preview-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  validate-source-package:
    name: M1 source package validation
    # A workflow_run can access write tokens. Only accept an exact successful
    # push to protected master with the intended release commit title; all
    # PR code runs separately with read-only permissions and no secrets.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_commit.message, 'chore(release): v0.3.0-alpha.1'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Confirm both package versions and honest source-only release notes
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib
          root = pathlib.Path('.')
          cli = tomllib.loads((root / "Cargo.toml").read_text())
          core = tomllib.loads((root / "crates/ezwallpaper-core/Cargo.toml").read_text())
          expected = "0.3.0-alpha.1"
          assert cli["package"]["name"] == "ezwallpaper"
          assert core["package"]["name"] == "ezwallpaper-core"
          assert cli["package"]["version"] == core["package"]["version"] == expected
          dependency = cli["dependencies"]["ezwallpaper-core"]
          assert dependency["path"] == "crates/ezwallpaper-core"
          assert dependency["version"] == "=" + expected
          notes = (root / "docs/releases/v0.3.0-alpha.1.md").read_text()
          for needle in ("v0.3.0-alpha.1", "Source-only", "experimental niri", "not been observed", "physical", "crates.io"):
              assert needle.lower() in notes.lower(), needle
          assert (root / "CHANGELOG.md").read_text().find(expected) >= 0
          print("M1 pre-release metadata and evidence scope verified")
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check both crate source manifests without publishing them
        run: |
          cargo package -p ezwallpaper-core --list --allow-dirty
          cargo package -p ezwallpaper --list --allow-dirty
      - name: Validate actual Core crate packaging (no crates.io upload)
        run: cargo publish --dry-run -p ezwallpaper-core --allow-dirty

  publish-github-prerelease:
    name: Publish M1 source-only GitHub prerelease
    needs: validate-source-package
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore(release): v0.3.0-alpha.1')
    runs-on: ubuntu-latest
    # The only write-capable job executes GitHub CLI against the protected,
    # already-tested exact SHA. No cargo, build scripts, PR code or artifacts
    # from other jobs are ever executed with write permission.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: v0.3.0-alpha.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish a single tag at the tested master SHA (no binary assets)
        shell: bash
        run: |
          set -euo pipefail
          actual_master="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [[ "$actual_master" != "$RELEASE_SHA" ]]; then
            echo "Refusing to publish from stale master: $RELEASE_SHA vs $actual_master" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already published; check existing release instead of overwriting."
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag exists without release: manual reconciliation required." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "ezwallpaper v0.3.0-alpha.1 — M1 Integration Preview" \
            --notes-file "docs/releases/v0.3.0-alpha.1.md" \
            --prerelease --latest=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isLatest,targetCommitish
