[workspace]
members = [".", "crates/ezwallpaper-core"]
default-members = ["."]
resolver = "2"

[package]
name = "ezwallpaper"
version = "0.2.1"
edition = "2018"
authors = ["li chaoran <pkwarcraft@gmail.com>"]
description = "CLI to fetch and set wallpaper from multiple sources"
homepage = "https://github.com/pkking/ezwallpaper.git"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.90"
clap = { version = "4.0.22", features = ["derive", "env", "string", "unicode"] }
dirs = "5.0.1"
env_logger = "0.11.5"
ezwallpaper-core = { path = "crates/ezwallpaper-core" }
log = "0.4.22"
wallpaper = "3.2.0"
