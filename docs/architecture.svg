<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="850" viewBox="0 0 1060 850" role="img" aria-labelledby="title desc">
  <title id="title">ezwallpaper Core and CLI architecture</title>
  <desc id="desc">Bing, Pexels, Wallhaven SFW and local files (including optional root-confined recursive catalogs) feed the headless Rust Core; opt-in image decoding and derivation produce safe static output. Core exposes local assets, a JSON manifest, a Rust API and pure content-ID rotation proposals; the opt-in CLI now wraps rotation in a locked state file with per-output Noctalia v5 path readback; isolated virtual dual-output pixel validation exists while physical display verification and automatic source replenishment remain unassessed. The CLI consumes Core and sets wallpapers through currently implemented operating system APIs and external programs; a CLI-owned WallpaperBackend trait, typed capability checks, Noctalia per-output IPC adapter, GNOME and Plasma global one-shot adapters, and the swaybg global one-shot early-process-check adapter plus LXQt pcmanfm-qt global one-shot adapter are implemented; Sway per-output rotation and renderer lifecycle, Plasma independent per-output rotation, Hyprpaper and Portal backend modules remain planned; third-party applications and scripts can also consume the assets. Future garbage collection and source extensions are planned. The opt-in, isolated Core-owned CAS implements import, inspect, export and verified listing; CLI emits a separate JSON store inventory v1.</desc>
